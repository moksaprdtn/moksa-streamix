<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STREAMIX - Admin Control Panel</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="padding: 2rem; background-color: var(--bg-main);">

  <!-- KOTAK LOGIN ADMIN (Muncul Pertama Kali) -->
  <div id="loginSection" style="max-width: 400px; margin: 5rem auto;">
    <div class="donation-card" style="padding: 2rem;">
      <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--text-main);">Admin Login</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="adminPassword">Masukkan Password Admin</label>
          <input type="password" id="adminPassword" placeholder="Password rahasia..." required style="width: 100%; padding: 0.75rem; margin-top: 0.5rem; background: var(--bg-card); border: 1px solid var(--border-color); color: white; border-radius: 8px;">
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem; width: 100%;">Masuk ke Panel</button>
        <div id="loginError" style="color: #EF4444; text-align: center; margin-top: 1rem; font-size: 0.9rem;"></div>
      </form>
    </div>
  </div>

  <!-- PANEL PENGATURAN UTAMA (Disembunyikan Sebelum Login Berhasil) -->
  <div id="adminPanelSection" style="max-width: 600px; margin: 0 auto; display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h1 style="font-size: 1.5rem;">Panel Kontrol Admin</h1>
      <div>
        <button id="logoutBtn" class="btn btn-outline btn-sm" style="margin-right: 0.5rem; border-color: #EF4444; color: #EF4444;">Keluar</button>
        <a href="index.html" class="btn btn-outline btn-sm">← Kembali ke Website</a>
      </div>
    </div>

    <div class="donation-card">
      <form id="adminSettingsForm">
        <div class="form-group">
          <label for="cfgVideoId">YouTube Video ID Utama</label>
          <input type="text" id="cfgVideoId" placeholder="Contoh: jfKfPfyJRdk" required>
        </div>
        <div class="form-group">
          <label for="cfgTitle">Judul Live Stream</label>
          <input type="text" id="cfgTitle" placeholder="Judul siaran..." required>
        </div>
        <div class="form-group">
          <label for="cfgChannel">Nama Channel</label>
          <input type="text" id="cfgChannel" placeholder="Nama channel..." required>
        </div>
        <!-- TAMBAHAN KOLOM: Channel URL -->
        <div class="form-group">
          <label for="cfgChannelUrl">Channel URL</label>
          <input type="url" id="cfgChannelUrl" placeholder="https://..." required>
        </div>
        <!-- TAMBAHAN KOLOM: Deskripsi -->
        <div class="form-group">
          <label for="cfgDescription">Deskripsi Siaran</label>
          <textarea id="cfgDescription" rows="3" placeholder="Tulis deskripsi..." style="width: 100%; padding: 0.75rem; margin-top: 0.5rem; background: var(--bg-card); border: 1px solid var(--border-color); color: white; border-radius: 8px;" required></textarea>
        </div>
        <div class="form-group">
          <label for="cfgRecMode">Mode Rekomendasi</label>
          <select id="cfgRecMode">
            <option value="MANUAL">MANUAL (Daftar Kurasi)</option>
            <option value="API">API (YouTube Data API v3)</option>
          </select>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Simpan Perubahan</button>
        <div id="adminStatus" style="text-align: center; margin-top: 1rem; font-size: 0.9rem;"></div>
      </form>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // TENTUKAN PASSWORD ADMIN ANDA DI SINI
    const ADMIN_PASSWORD_RAHASIA = "@Sayaakanlawan"; 

    const loginSection = document.getElementById('loginSection');
    const adminPanelSection = document.getElementById('adminPanelSection');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');

    // Cek apakah admin sudah pernah login sebelumnya di browser ini
    if (sessionStorage.getItem('streamix_logged_in') === 'true') {
      loginSection.style.display = 'none';
      adminPanelSection.style.display = 'block';
    }

    // Aksi ketika tombol Login ditekan
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const enteredPassword = document.getElementById('adminPassword').value;

      if (enteredPassword === ADMIN_PASSWORD_RAHASIA) {
        sessionStorage.setItem('streamix_logged_in', 'true');
        loginSection.style.display = 'none';
        adminPanelSection.style.display = 'block';
        
        loginForm.reset(); 
        loginError.textContent = ""; 
      } else {
        loginError.textContent = "Password salah! Silakan coba lagi.";
      }
    });

    // Aksi Tombol Keluar (Logout)
    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem('streamix_logged_in');
      document.getElementById('loginForm').reset();
      document.getElementById('adminSettingsForm').reset();
      location.reload();
    });

    // Aksi ketika tombol Simpan ditekan
    document.getElementById('adminSettingsForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const videoId = document.getElementById('cfgVideoId').value.trim();
      const title = document.getElementById('cfgTitle').value.trim();
      const channel = document.getElementById('cfgChannel').value.trim();
      const channelUrl = document.getElementById('cfgChannelUrl').value.trim();
      const description = document.getElementById('cfgDescription').value.trim();
      const recMode = document.getElementById('cfgRecMode').value;

      // Simpan data inputan admin ke localStorage agar dibaca index.html
      localStorage.setItem('streamix_videoId', videoId);
      localStorage.setItem('streamix_title', title);
      localStorage.setItem('streamix_channel', channel);
      localStorage.setItem('streamix_channelUrl', channelUrl);
      localStorage.setItem('streamix_desc', description);
      localStorage.setItem('streamix_recMode', recMode);

      const status = document.getElementById('adminStatus');
      status.style.color = '#10B981';
      status.textContent = "Pengaturan berhasil disimpan! Perubahan aktif di halaman utama.";

      // Mengosongkan form kembali setelah disimpan
      e.target.reset();
    });
  </script>
</body>
</html>
